# 后台登录的滑块验证码（AJ-Captcha 自带的 /captcha/get、/captcha/check）。
# 单独一个桶而不是复用其它 location：验证码只在该账号连续失败达阈值后才出现，
# 正常流量极低 —— 阈值可以取紧一些。应用侧还有一层按 clientUid 的分钟级限流
# （见 app.yml 的 aj.captcha.req-*），这里只按 IP 兜底。
limit_req_zone $binary_remote_addr zone=admin_captcha:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # 被限时回 429（而不是 nginx 默认的 503），与后端 @RateLimit 的业务码口径一致：
    # 前端据此区分「请求过于频繁」和「服务真的挂了」。
    limit_req_status 429;

    # 前端静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台管理 API（含 SSE）
    location /admin-api/ {
        proxy_pass http://server:8080/admin-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前台公开 API
    location /app-api/ {
        proxy_pass http://server:8080/app-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录用的滑块验证码：端点写死在 /captcha/**（不在 /admin-api 前缀下）。
    # 少了这条，请求会落到 `location /` 的 try_files 上 —— 返回 index.html 而不是 404，
    # 前端表现为「JSON 解析失败 / repCode undefined」，比直接 404 更难查。
    location /captcha/ {
        # 每次响应都不同（随机底图 + 一次性 token），绝不能进缓存
        proxy_cache off;
        limit_req zone=admin_captcha burst=5 nodelay;
        proxy_pass http://server:8080/captcha/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆写而非追加：客户端伪造的转发链不该被后端采信（后端还有 TrustedProxyHostUtil 兜底）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 健康检查
    location = /health {
        proxy_pass http://server:8080/admin-api/system/health;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
