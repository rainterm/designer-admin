# 应用：Server + 管理后台（依赖已就绪的 MySQL / Redis）
# 用法：./deploy-app.sh
# 通过 .env 中 DB_* / REDIS_* 连接数据库（本机 Docker 库默认 host.docker.internal）

name: ${COMPOSE_PROJECT_NAME:-designer-admin}-app

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: designer-admin-server:${IMAGE_TAG:-1.0.0}
    container_name: designer-admin-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -Dfile.encoding=UTF-8}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-designer_admin}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-5}
    volumes:
      - server_uploads:/app/uploads
      - server_logs:/app/logs
    ports:
      - "${SERVER_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 限制容器标准输出日志（应用控制台日志 / 启动报错）大小，避免撑满磁盘。
    # 应用自身的文件日志走 server_logs 卷，由应用侧的 maxHistory / totalSizeCap 控制。
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - designer-app-net

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: designer-admin-web:${IMAGE_TAG:-1.0.0}
    container_name: designer-admin-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    # 限制 Nginx 访问 / 错误日志容器输出大小
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - designer-app-net

volumes:
  server_uploads:
  server_logs:

networks:
  designer-app-net:
    driver: bridge
